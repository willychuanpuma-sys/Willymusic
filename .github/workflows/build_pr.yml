name: Build PR

on:
  pull_request:
    branches:
      - "**"
    # Weblate PRs only touch localized string files, which cannot break a
    # build that the base branch already compiles. The default (unsuffixed)
    # `values/` directory is deliberately not listed, so English string
    # changes still build.
    paths-ignore:
      - "app/src/main/res/values-*/strings.xml"
      - "app/src/main/res/values-*/metrolist_strings.xml"
      - "fastlane/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  jamendo_probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check public Jamendo search response
        env:
          JAMENDO_CLIENT_ID: "4e997d93"
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.parse
          params = urllib.parse.urlencode({"client_id": os.environ["JAMENDO_CLIENT_ID"], "format": "json", "search": "piano", "limit": 2, "audioformat": "mp32"})
          try:
              with urllib.request.urlopen("https://api.jamendo.com/v3.0/tracks/?" + params, timeout=25) as r:
                  data = json.load(r)
              tracks = data.get("results", [])
              print(json.dumps({"status": data.get("headers", {}).get("status"), "code": data.get("headers", {}).get("code"), "returned": len(tracks), "audio_locations": [{"scheme": urllib.parse.urlsplit(t.get("audio", "")).scheme, "host": urllib.parse.urlsplit(t.get("audio", "")).hostname} for t in tracks]}))
          except Exception as e:
              print(type(e).__name__ + ": public API check could not complete")
          PY

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: 21
          distribution: "temurin"

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: true
          cache-cleanup: on-success

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Restore PR debug keystore
        id: pr_keystore
        uses: actions/cache/restore@v6
        with:
          path: app/pr-debug.keystore
          key: pr-debug-keystore-${{ github.event.number }}

      - name: Generate PR debug keystore if not cached
        if: steps.pr_keystore.outputs.cache-hit != 'true'
        run: |
          keytool -genkeypair -v \
            -keystore app/pr-debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Metrolist PR ${{ github.event.number }},O=Metrolist,C=US"

      - name: Save PR debug keystore
        if: steps.pr_keystore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: app/pr-debug.keystore
          key: ${{ steps.pr_keystore.outputs.cache-primary-key }}

      - name: Test music providers and build FOSS Debug APK
        run: ./gradlew --console=plain :app:testFossDebugUnitTest --tests "com.metrolist.music.providers.ExternalMusicRepositoryTest" :app:assembleFossDebug --warning-mode summary
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          METROLIST_APPLICATION_ID: com.metrolist.music.pr.p${{ github.event.number }}
          METROLIST_APP_NAME: Willy Music Prueba
          METROLIST_DEBUG_KEYSTORE_PATH: pr-debug.keystore
          PULL_REQUEST: "true"
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: app-universal-debug-pr-${{ github.event.number }}
          path: app/build/outputs/apk/foss/debug/*.apk
